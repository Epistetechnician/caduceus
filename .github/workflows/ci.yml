name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m compileall -q caduceus plugin tests
      - run: python3 scripts/vendor_plugin.py --check
      - run: python3 -m unittest discover -s tests -t . -v
      - run: python3 -m caduceus demo --out "$RUNNER_TEMP/demo" && python3 -m caduceus verify-ledger "$RUNNER_TEMP/demo/ledger.jsonl"
      - run: python3 scripts/demo_hackathon.py
