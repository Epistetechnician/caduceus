[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caduceus"
version = "0.1.0"
description = "Verified evolution for Hermes Agent: admission core, evolution ledger, skill contracts (Phase 1 substrate)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
caduceus = "caduceus.cli:main"

[tool.setuptools]
packages = ["caduceus"]
