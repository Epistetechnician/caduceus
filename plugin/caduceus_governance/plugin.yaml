name: caduceus-governance
version: 0.1.0
description: "Govern what Hermes may write into its own skills: a deterministic, model-free admission kernel with a tamper-evident ledger, content lanes, operator-owned executable checks, and a provenance lane that quarantines skill writes made after untrusted web/browser/MCP content entered the session. Observe by default. No network, no model calls."
author: "Epistetechnician"
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - post_tool_call
  - on_skill_lifecycle
